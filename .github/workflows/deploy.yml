name: Deploy Medtrax Backend

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-medtrax
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            USER_NAME="${{ secrets.EC2_USER || secrets.EC2_USERNAME || 'ubuntu' }}"
            APP_DIR="/home/$USER_NAME/apps/medtrax"
            
            echo " Navigating to $APP_DIR..."
            cd "$APP_DIR"

            echo " Pulling latest code from main branch..."
            git pull origin main

            echo " Building and starting application services..."
            docker compose up -d --build db redis web celery celery-beat

            echo " Verifying backend healthz endpoint..."
            sleep 10
            HEALTHY=false
            for i in $(seq 1 12); do
              if curl -s -f http://127.0.0.1:8000/healthz/ > /dev/null 2>&1; then
                echo "✅ MedTrax backend is healthy and responding!"
                HEALTHY=true
                break
              fi
              echo "⏳ Waiting for Daphne / Django to become healthy ($i/12)..."
              sleep 5
            done

            if [ "$HEALTHY" = false ]; then
              echo "❌ Healthcheck failed! Displaying container logs:"
              docker logs --tail 50 medtrax-web
              exit 1
            fi

            echo " Pruning dangling Docker images..."
            docker image prune -f

            echo " Deployment completed successfully!"
            docker compose ps
