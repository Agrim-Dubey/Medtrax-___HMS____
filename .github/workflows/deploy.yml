name: Deploy Medtrax (Dockerized)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-medtrax
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push medtrax image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: agrim96336/medtrax-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            APP_DIR="/home/${{ secrets.EC2_USERNAME || 'ubuntu' }}/apps/medtrax"
            echo "Navigating to $APP_DIR..."
            cd "$APP_DIR"

            echo "Pulling latest code from Git..."
            git pull origin main

            echo "Pulling latest Docker image..."
            docker compose pull web celery celery-beat || true

            echo "Starting application services..."
            docker compose up -d db redis web celery celery-beat

            echo "Verifying health..."
            sleep 10
            HEALTHY=false
            for i in $(seq 1 12); do
              if curl -s -f http://127.0.0.1:8000/healthz/ > /dev/null 2>&1; then
                echo "MedTrax backend is healthy!"
                HEALTHY=true
                break
              fi
              echo "Waiting for backend to become healthy ($i/12)..."
              sleep 5
            done

            if [ "$HEALTHY" = false ]; then
              echo "Healthcheck failed! Showing container logs:"
              docker logs --tail 50 medtrax-web
              exit 1
            fi

            echo "Pruning dangling images..."
            docker image prune -f
            docker compose ps
