services:
  db:
    image: postgres:15-alpine
    container_name: medtrax-db
    restart: always
    environment:
      POSTGRES_DB: medtraxdata
      POSTGRES_USER: medtraxadmin
      POSTGRES_PASSWORD: Medtrax2025
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medtraxadmin -d medtraxdata"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medtrax-redis
    command: ["redis-server"]
    restart: always
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medtrax-web
    env_file:
      - .env
    command: >
      sh -c "
        while ! nc -z db 5432; do sleep 1; done &&
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        daphne -b 0.0.0.0 -p 8000 medtrax.asgi:application
      "
    volumes:
      - ./:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medtrax-celery
    env_file:
      - .env
    command: sh -c "sleep 15 && celery -A medtrax worker --loglevel=info"
    volumes:
      - ./:/app
    depends_on:
      - redis
      - db
      - web
    restart: always

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medtrax-celery-beat
    env_file:
      - .env
    command: sh -c "sleep 20 && celery -A medtrax beat --loglevel=info"
    volumes:
      - ./:/app
    depends_on:
      - redis
      - db
      - web
    restart: always

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: medtrax-prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
  prometheus_data:

